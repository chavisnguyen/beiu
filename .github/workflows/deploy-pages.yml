name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Verify production build (not dev index.html)
        run: |
          echo "=== dist/index.html ==="
          head -n 15 dist/index.html
          test -f dist/index.html
          test -f dist/.nojekyll
          if grep -q '/src/main.jsx' dist/index.html; then
            echo "::error::dist/index.html vẫn là bản DEV. Cần chạy npm run build trước khi deploy."
            exit 1
          fi
          if ! grep -Eq 'src="\./assets/|src="/assets/' dist/index.html; then
            echo "::error::Không thấy bundle JS trong dist/index.html"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
