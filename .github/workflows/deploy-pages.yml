name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Project site: https://tech-dicsoft.github.io/beiu/
  VITE_BASE_URL: /beiu/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify production build (not dev index.html)
        run: |
          echo "=== dist/index.html ==="
          head -n 15 dist/index.html
          test -f dist/index.html
          test -f dist/.nojekyll
          if grep -q '/src/main.jsx' dist/index.html; then
            echo "::error::Đang deploy bản DEV — phải dùng dist sau npm run build."
            exit 1
          fi
          if ! grep -Eq 'src="[^"]*assets/' dist/index.html; then
            echo "::error::Không thấy bundle JS trong dist/index.html"
            exit 1
          fi

      - name: SPA fallback for client-side routing
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
